name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker
        run: python -m py_compile scripts/check_bilingual_docs.py
      - name: Validate bilingual portal
        run: python scripts/check_bilingual_docs.py
      - name: Check whitespace
        run: git diff --check HEAD

